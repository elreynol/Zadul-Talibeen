- id: 12
  commentary: 'Some scholars have taken Iman (faith) to mean prayer (salat) in this
    context. Hence,

    purity becomes half of prayer because it is the most important prerequisite of
    the prayer.

    Another explanation is that just as entering into faith eliminates one’s major
    and minor

    sins, the performing of ablution ( wudu ) eliminates one’s minor sins. This hadith
    can also be taken as a general exhortation toward purity in all one’s

    states and actions. Furthermore, it is important to note that purity ( tahara
    ) is differ¬

    ent from cleanliness ( nazdfa ). The former means to be free from physical impurities

    (najdsa) like blood, urine, or stool, and from the state of ritual impurity (
    hadath and

    janaba), while the latter means to appear outwardly clean. Though this hadith
    speaks

    of purity in particular, Muslims ought to be both pure and clean, as was the practice

    of Allah’s Messenger S.


