- id: 8
  commentary: 'This hadlth describes the contrast between two types of people. The
    first type is a true

    believer who shuns the affairs of this world and occupies himself with making
    provisions

    for the next world. At times, this type of person may be deceived in his worldly
    affairs,

    not out of ignorance, but because of his generous and noble character and lack
    of concern

    for the material objects of this world, and he is free of cynicism toward others.


    The second type of person is a transgressor or an unrighteous person who is well

    acquainted with the methods of deception. He never allows himself to be deceived,
    but

    continually deceives others. He is ungenerous in his nature. This type of person
    has

    been characterized by the Messenger & as ignoble and his nature contrary to that
    of a

    true believer.


