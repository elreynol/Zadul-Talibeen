- id: 17
  commentary: 'This narration continues with the Companions asking the Messenger of
    Allah & why

    backbiting is more severe. Allah’s Messenger replied that the person who fornicates

    is forgiven by Allah if he sincerely repents, but the one who backbites is not
    forgiven

    until the person he transgressed against forgives him.


    Another reason for this is that unlawful intercourse is normally recognized by
    the

    fornicator as a serious sin; hence, there is a greater chance of him turning to
    Allah and

    repenting. On the other hand, a person who backbites does not normally realize
    the

    seriousness of his sin and takes it lightly; hence, he does not stop and repent.
    For definition of backbiting, see chapter 3, hadith 30.


