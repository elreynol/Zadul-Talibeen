- id: 24
  commentary: 'Listening to [instrumental] music is clearly prohibited in Islam. Allah
    says, “And of

    mankind is he who pays for mere pastime of discourse, that he may mislead from

    Allah’s way without knowledge, and makes it the butt of mockery. For such there
    is a

    humiliating punishment” (Qur’an 31:6). Many of the great exegetes of the Qur’an,
    such

    as ''Abdullah ibn Mas''ud, Ibn ''Abbas, Ibn ‘Umar Tkrima, Maymun ibn Mahran, and

    Makhul state that this verse directly refers to singing. Imam Tirmidhi has narrated
    on the

    authority of‘All 4 * that the Messenger of Allah & said, “When my nation adopts
    fifteen

    traits, trials will descend upon them—among these traits are taking to songstresses
    and

    musical instruments” (Qurtubi, Al-Jdmi‘li ahkdm al-Quran 14:51-53).


    In another verse, Allah Most High says, “And excite from them whom you can with

    your voice; make assaults on them with your cavalry and your infantry; mutually
    share

    with them wealth and children; and make promises to them. But Satan promises them

    nothing but deceit” (Qur’an 17:64). The great exegete Mujahid states that the
    reference

    to a satanic voice in this verse refers to singing, the flute, and entertainment.
    Ibn ''Abbas


    36 fsad

    4s> states that this verse refers to all voices which invite toward disobedience.
    In a hadith, the Messenger of Allah said, “There will be

    people in my nation who will seek to make lawful fornication, silk, intoxicants,
    and

    musical instruments” (Bukhari).


    Therefore, Imam Nawawi concludes in his Rawda, “Singing using only ones voice
    is

    as disliked ( makruh) as is listening to it. More strongly disliked is to listen
    to the sing¬

    ing of a marriageable woman ( ajnabiyya ). Singing with the accompaniment of musical

    instruments—the sign of those who are taken to drinking liquor—like the lute (
    c ud),

    mandolin ( tanbur ), cymbal (sanj), and all stringed instruments ( ma c azif )
    is prohibited

    (haram). Likewise, listening to it is also prohibited”. And

    ''Allama Haskafi, the great Syrian jurist, states in his compendium on legal rulings,
    “As

    for listening to musical instruments ... it is prohibited and an act of disobedience....
    If

    someone happens to hear it accidentally, then there is no sin on him. He must,
    however,

    do all he can to avoid it, since it has been narrated that the Messenger of Allah
    # inserted

    his fingers into his ears when he heard it” (Al-Durr al-mukhtar 5:223).


    There are several rigorously authenticated hadiths on the unlawfulness of musi¬

    cal instruments, with the exception of the duff, a one-sided small drum, whose
    use the

    Messenger of Allah & permitted in announcing weddings ( Tirmidhi ). It is thus
    permit¬

    ted, as mentioned by Ibn Hajar al-Makki al-Haytaml and others, to use such drums

    to announce marriages and consummation ceremonies, and some scholars have also

    included occasions such as a circumcision, Td, the return from a journey, and
    the happy

    gatherings of friends. However, Mulla ''All al-Qarl, quoting the great Egyptian
    jurist, Ibn

    al-Humam, clarifies that such drums should not include jingling discs (i.e., tambourines),

    as they are not permitted. The hadith master Ibn Hajar

    al-''Asqalanl has also defined a duff as a one sided drum without discs, and explains
    that

    the tambourine is called a muzhir (Fath al-Bdri 1:694). The songs prohibited in
    the texts

    above have been explained as those accompanied by musical instrument other than
    a

    duff, or those containing lewd words or ideas, or any such unlawful content. However,

    songs or nashids in praise of Allah or His Messenger S or other non-sinful themes
    that

    are free of musical instruments cannot be considered unlawful.'
