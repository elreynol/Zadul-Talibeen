- id: 6
  commentary: 'Hadith narrations mention that there are more than seventy branches
    of faith. Of these,

    haya (modesty, bashfulness, shyness) is specifically mentioned, affirming it as
    one of

    the most important branches. Haya is an important means of restraining oneself
    from

    sin, and restraint from sin is one of the most important obligations of faith.


    The type of haya'' referred to in this hadith is the modesty that comes from faith
    and

    not the natural shyness in a person. It has been explained by the saying, “Your
    Lord to

    not find you from where He has prohibited you,” which is also part of ihsan, or
    “per¬

    fection of faith”.


    ‘Abdullah ibn Mas'' ud relates that one day the Messenger of Allah St said, “Be
    shy

    of Allah Most High as much as is His due.” The Companions present said, “All praise
    to


    Allah, we are shy of Him.” The Messenger # said, “That is not the point. Whoever
    is shy

    of Allah as much as is His due, he should protect his head and that which it comprises

    [i.e., mind, mouth, ears], his stomach and that which is adjoining it [i.e., preserve
    it

    from unlawful wealth and protect the private parts from the unlawful], and he
    should

    remember death and that which is to come after it; and whoever desires the Hereafter

    should abandon the adornments of this world. Whoever fulfills these duties has
    been

    shy of Allah as much as is His due”.


