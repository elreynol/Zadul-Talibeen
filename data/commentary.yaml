- id: 19
  commentary: 'This is confirmed by another hadith in Sahih al-Bukhari and Muslim
    in which the

    Messenger of Allah ® said, “I have not left behind me any trial (fitna) more harmful
    to


    men than women.” The essence of the narration is that Satan often employs women
    as a

    lure for men, time and time again, leading to the committal of sinful acts. However,
    this

    is not to say that women are inherently evil, or that they are the sole cause
    of mens sins,

    or that men have been absolved from the evil prevalent in society. Rather, the
    narration

    alludes to the natural attraction men possess for women, by which Satan lures
    them into

    sin. This is why men have been commanded to lower their gazes and why women have

    been commanded to abide by a modest dress code. These are safety measures for
    both

    sexes—if a man does not lower his gaze, the modest dress of women will prevent
    him

    from realizing any of his sinful behavior, and vice versa. The use of women as
    snares

    is an undeniable fact that can be observed today in, among other places, the advertis¬

    ing industry. Of course, men who use women for commercial gain—as stewardesses,

    models, pornographers, and prostitutes, for instance—are as accursed, perhaps
    even

    more than the women whom they exploit. People who clamor about womens abuse

    and strive to eradicate it ought to turn their attention to this degradation of
    women,

    which has doubtlessly led to the objectification of women and high incidences
    of sexual

    harassment, domestic assault, and other crimes related to women’s abuse. And to
    Allah

    is our complaint.'
