  commentary: 'A narration in Sunan al-Bayhaqi from ''Abdullah Ibn ''Umar £> states,
    “Alcohol is the

    mother of all obscenities and the gravest of sins. Whoever consumes alcohol abandons

    prayer and commits adultery with his mother and with his paternal and maternal

