- id: 1
  commentary: 'The Arabic word al-nastha, used in the hadith above, is a comprehensive
    and unique

    term and is difficult to translate precisely into English. Even in Arabic, it
    does not have

    a synonym. Therefore, the expression “to act with sincerity” has been adopted
    here as a

    broad explanation for the Arabic word. Other meanings could be—giving good advice,

    directing toward good, acting sincerely or honestly, or being benevolent and desiring

    good (see Lane, Arabic English Lexicon).


    The remainder of the hadith, as narrated by Imam Muslim on the authority of Tamim

    al-Dari is: “We inquired from the Messenger of Allah, ‘Toward whom?’ He replied,

    ‘For Allah, His Book, His Messenger, the leaders of the Muslims, and the common

    people’” (Muslim). The hadith makes clear that one of the most important aspects

    of true faith is to give good counsel, to wish well, and to act toward everything
    with

    honesty and sincerity.


    This is further explained as follows: In relation to Allah, “sincerity” means
    to have

    faith in His essence and attributes, to obey His each and every command, to express

    gratitude for His blessings, and to fulfill His rights of Lordship in every possible
    way.

    In terms of the Book of Allah, it means to fulfill its rights by accepting it
    as the word

    of Allah, honoring it and reciting it correctly, and practicing its injunctions.
    For the

    Messenger of Allah ife, it means to fulfill his rights, confirm that he is the
    Messenger of

    Allah, practice his Sunna, honor him and his family, and hold everything that
    he has

    said to be true. For the leaders of the Muslims, it means to assist them in virtue,
    obey

    them and exhort others to do the same, remind them of their responsibilities and
    cor¬

    rect them in a polite, reformative, and wise manner. The same applies for the
    scholars

    of Islam. For the masses, it is to guide them aright and prevent them from wrong,
    assist


    them in their needs and support them, protect them from harm, and deal with them

    in the best possible manner.


    Similarly, as regards every other aspect of life, the religious obligation of
    nasiha is

    fulfilled by performing everything in the most beneficial and correct manner possible.'
- id: 2
  commentary: 'Supplication (duft) has been called the essence of worship for two
    main reasons. First,

    by supplicating to Allah, a person fulfills his obligation of calling on Allah,
    which is

    understood from the verse “And your Lord says, ‘Call on Me, I will answer you
    (your

    prayer)’” (Quran 40:60). This is worship in its purest form. Second, by invoking
    Allah,

    one realizes that only He can fulfill one’s needs. The servant who calls upon
    his Lord

    abandons hope in everything else and turns his full attention to Allah, humbling
    himself

    in front of Him. This is the essence of worship. Another desired result of worship
    is

    to attain reward from Allah. Because there is such great reward in supplication,
    it has

    been called the essence of worship.'
- id: 3
  commentary: 'This statement of the Messenger of Allah & was in response to someone
    who came and

    inquired, “O Messenger of Allah, what do you say about someone who loves a group
    of

    people, but is unable to join them?” What is meant by “a group of people” is the
    learned

    or righteous people, and what is meant by, “was unable to join them,” is a person
    who

    was unable to gain their company or achieve the same status as them in knowledge

    and action. To this the Messenger of Allah & replied, “A person will be with whom
    he

    loves,” i.e., he will be gathered with them on the Day of Judgment. Allah Most
    High

    says, “Whosoever obeys Allah and the Messenger, they will be with those unto whom

    Allah has shown favor, of the Prophets and the saints and the martyrs and the
    righteous.

    The best of company are they” (Qur’an 4:69-70).


    This hadlth could also be applied more generally to those who aspire to be with
    evil

    people and sinners and secretly admire their actions, even though they may not
    have

    perpetrated those evil actions themselves. They will be gathered with the sinners
    on

    the Day of Judgment.


