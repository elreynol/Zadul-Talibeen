- id: 22
  commentary: 'The person who subdues his lower self is that person who renders himself
    in complete

    obedience to the commands of Allah. In this parable, the one who carries vain
    hopes

    about Allah is the one who thinks, “My Lord is Most Generous and Merciful,” and

    forgets that Allah has also said, “O man! What has seduced you from your Lord,
    Most

    Beneficent?” (Quran 82:6). Also, “Tell my servants that I am indeed the Oft-Forgiving,

    Most Merciful, and that My chastisement will be indeed the most grievous chastisement”

    (Qur’an 15:49). The soul is like a horse which would take

    its own course when without reigns; however, when subjugated by them it follows.
    In

    this regard Allama Busayrl provides a beautiful parable:


    The self is like a child who if you let alone would grow up

    In love of suckling, but if you wean it would be weaned.


    Then keep its desires in check and beware that it does not overpower you.

    Verily lust when it overpowers humiliates or destroys.'
