  commentary: 'One meaning of this hadith is that a person in whom these signs are
    found is a hypo¬

    crite ( mundfiq ) toward the person he has wronged. He can not be called a hypocrite

    in religion since he is not concealing unbelief; however, his actions resemble
    those of

    a true hypocrite.


    Another explanation is that hypocrisy ( nifaq —outwardly showing something differ¬

    ent from what one feels or believes inwardly) is of two types: that which is related
    to

    belief (the greater and true hypocrisy) and that which is in action (the lesser
    hypocrisy).

    c Allama Khattabi, the great hadith scholar of the fourth century ah, states that
    the signs

    mentioned in this hadith refer to the latter—a person in whom these are found
    will be

    considered a hypocrite in action and not a hypocrite in belief. Yet another explanation

    is that these are the signs of the true hypocrite and the continuous performance
    of these

    sins could eventually lead a person to hypocrisy of faith.


    “[...] he breaks it” means a person who has resolve from the outset to not fulfill
