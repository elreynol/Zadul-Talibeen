- id: 4
  commentary: 'This hadith refers to everyday activities and not to acts of worship.
    A person is en¬

    couraged to conduct his daily activities with calmness and patience, as acting
    in haste

    often leads to spoiling one’s actions. However, when it comes to worship, a person
    is

    encouraged to hasten toward good, i.e., embark upon good acts with determination

    and eagerness, and then complete them with calmness, concentration, and devotion

    {Mirqat al-mafatih 8:786). For example, it is disliked for one to run to join
    the

    prayer, but it is commendable to perform the ablution ( wudu ) at home and set
    out

    for the prayer early.'
