  commentary: 'Here, “Moderation in spending..is best understood by the verse of the
    Qur an: “Those

    who, when they spend, are not extravagant and not miserly, but hold a just balance

    between the two” (Quran 25:67). [The income a person receives is mostly not in
    one’s

    control, as opposed to the spending of what one possesses, which is nearly always
    in his

    control. Hence, regulating what one spends of his wealth can provide half the
    answer

    to stability in one’s livelihood.] “Friendliness toward people...” means that
    a person’s

    intelligence is perfected through interaction with others, in that the collaboration
    of

    two minds is better than one. And “Asking good questions is half of one’s knowledge”

    because knowledge of a particular issue only becomes complete by asking the appro¬

    priate questions. Also, fully thinking through a question

    before seeking an answer provides half the answer to the questioner, as opposed
    to

    random questioning.


