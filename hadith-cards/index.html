<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Provisions of the Seekers — Zād al-Ṭalibīn (1–60)</title>
    <link rel="stylesheet" href="styles.css?v=15">
  </head>
  <body>
    <main id="pages" class="print-stack" aria-label="Printable Zād al-Ṭalibīn provisions">
      <p class="load-message">Loading cards…</p>
    </main>

    <script src="hadiths.js?v=14"></script>
    <script>
      const cardsPerPage = 10;
      const totalPages = 6;
      const themeAssets = [
        { id: "cream", bg: "#fdf8ee", accent: "#c9a05a" },
        { id: "mint", bg: "#f7f7f0", accent: "#8ea866" },
        { id: "blush", bg: "#fdf3ee", accent: "#d8897a" },
        { id: "sky", bg: "#f2f5f7", accent: "#6f9eb8" },
        { id: "wheat", bg: "#fef7ea", accent: "#c9922f" },
        { id: "lavender", bg: "#f3eef4", accent: "#9a7eb5" },
        { id: "teal", bg: "#f1f6f4", accent: "#5f9a8f" },
        { id: "peach", bg: "#fdf3ec", accent: "#d07f55" },
        { id: "slate", bg: "#eef4f7", accent: "#6a9bc4" },
        { id: "master", bg: "#fefbf8", accent: "#a89562" }
      ];
      const pagesRoot = document.getElementById("pages");

      function pickTheme(index) {
        return index % 10 === 9 ? themeAssets[9] : themeAssets[index % 9];
      }

      function escapeHTML(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      const lengthThresholds = {
        arabic: { long: 70, veryLong: 110 },
        english: { long: 120, veryLong: 170 }
      };

      function textLengthClass(text, script) {
        const n = (text || "").length;
        const thresholds = lengthThresholds[script];
        if (n > thresholds.veryLong) return "very-long";
        if (n > thresholds.long) return "long";
        return "";
      }

      function tierRank(tier) {
        if (tier === "very-long") return 2;
        if (tier === "long") return 1;
        return 0;
      }

      function cardLengthClass(hadith) {
        const arabicTier = textLengthClass(hadith.arabic, "arabic");
        const englishTier = textLengthClass(hadith.english, "english");
        return tierRank(arabicTier) >= tierRank(englishTier) ? arabicTier : englishTier;
      }

      function cutGuides() {
        return `
          <span class="cut-guide cut-guide--vertical" aria-hidden="true"></span>
          <span class="cut-guide cut-guide--horizontal" style="top: calc(20% - 0.0255in)" aria-hidden="true"></span>
          <span class="cut-guide cut-guide--horizontal" style="top: calc(40% - 0.0085in)" aria-hidden="true"></span>
          <span class="cut-guide cut-guide--horizontal" style="top: calc(60% + 0.0085in)" aria-hidden="true"></span>
          <span class="cut-guide cut-guide--horizontal" style="top: calc(80% + 0.0255in)" aria-hidden="true"></span>
        `;
      }

      function cardTemplate(hadith, index) {
        const theme = pickTheme(index);
        const themeClass = `theme-${(index % 10) + 1}`;
        const arabicClass = textLengthClass(hadith.arabic, "arabic");
        const englishClass = textLengthClass(hadith.english, "english");
        return `
          <article class="card ${themeClass} ${cardLengthClass(hadith)}" style="--card-bg:${theme.bg};--accent:${theme.accent}">
            <div class="card-copy">
              <p class="arabic ${arabicClass}" lang="ar" dir="rtl">${escapeHTML(hadith.arabic)}</p>
              <hr class="copy-rule" aria-hidden="true">
              <p class="english ${englishClass}">${escapeHTML(hadith.english)}</p>
            </div>
            <p class="source">${escapeHTML(hadith.source)}</p>
          </article>
        `;
      }

      function render() {
        if (typeof hadiths === "undefined" || !Array.isArray(hadiths)) {
          pagesRoot.innerHTML = `
            <p class="load-message load-message--error">
              Could not load <code>hadiths.js</code>. Start a local server from the repo root
              (<code>python3 -m http.server 8000</code>), then open
              <a href="http://localhost:8000/hadith-cards/">http://localhost:8000/hadith-cards/</a>.
            </p>
          `;
          return;
        }

        const paddedHadiths = [...hadiths];
        while (paddedHadiths.length < cardsPerPage * totalPages) {
          paddedHadiths.push({
            arabic: "نَصُّ الْحَدِيثِ الْعَرَبِيُّ هُنَا",
            english: "English translation placeholder goes here.",
            source: "Source placeholder"
          });
        }

        pagesRoot.innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
          const start = pageIndex * cardsPerPage;
          const pageHadiths = paddedHadiths.slice(start, start + cardsPerPage);
          return `
            <section class="sheet" aria-label="Page ${pageIndex + 1} of ${totalPages}">
              <p class="page-label">Page ${pageIndex + 1} of ${totalPages}</p>
              <div class="cards">
                ${cutGuides()}
                ${pageHadiths.map((hadith, index) => cardTemplate(hadith, start + index)).join("")}
              </div>
            </section>
          `;
        }).join("");
      }

      render();
    </script>
  </body>
</html>
